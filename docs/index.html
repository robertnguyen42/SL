<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản tin Di trú</title>
<meta name="description" content="Tin di trú Mỹ, Úc, Canada, Châu Âu, Dubai theo từng cột thị trường">
<style>
/* Bố cục: thanh lọc dính trên cùng, bên dưới là bảng 5 cột thị trường, mỗi cột cuộn riêng trên màn hình rộng */
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d23;--muted:#667085;--line:#e4e7ec;--accent:#1d4ed8;--new:#dc2626;
 --US:#1d4ed8;--AU:#047857;--CA:#b91c1c;--EU:#1e3a8a;--AE:#a16207;--NZ:#0f766e;--siet:#b91c1c;--noi:#047857}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;--accent:#60a5fa;
 --US:#60a5fa;--AU:#34d399;--CA:#f87171;--EU:#a5b4fc;--AE:#facc15;--NZ:#5eead4;--siet:#dc2626;--noi:#059669;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px}
.meta{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.bar button,.bar select{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar button span{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.bar input{flex:1;min-width:180px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.board{display:grid;grid-template-columns:repeat(5,minmax(260px,1fr));gap:12px;padding:12px 16px 24px;overflow-x:auto}
.col{display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px solid var(--line);border-radius:12px}
.col h2{margin:0;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--c);position:sticky;top:0;background:inherit;border-radius:12px 12px 0 0}
.col h2 .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.list{padding:8px;display:flex;flex-direction:column;gap:8px}
@media (min-width:1100px){.col{max-height:calc(100vh - 150px)}.list{overflow-y:auto}}
@media (max-width:1099px){.board{grid-template-columns:repeat(5,minmax(280px,85vw));scroll-snap-type:x mandatory}.col{scroll-snap-align:start}
 .top{position:static}}   /* điện thoại: thanh lọc cuộn đi để nhường chỗ cho tin */

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.card a{color:var(--text);text-decoration:none;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card a:hover{color:var(--accent)}
.card p{margin:4px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tags .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.dir{border-radius:4px;padding:0 5px;font-weight:700;color:#fff}
.dir.siet{background:var(--siet)}.dir.noi{background:var(--noi)}
.pol{border:1px solid var(--muted);border-radius:4px;padding:0 4px}
.gtag{color:var(--accent);font-weight:600}
.vtag{background:var(--line);border-radius:4px;padding:0 5px;color:var(--text)}
.off{border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px}
.badge{background:var(--new);color:#fff;border-radius:4px;padding:0 5px;font-weight:700}
.more{margin:2px 8px 10px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px;cursor:pointer;font-size:13px}
.more:hover{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:13px}

.sum{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.sum summary{cursor:pointer;font-weight:700}
.sum ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.sum .imp{color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px #0003;border:0;font-size:14px}
</style>
</head>
<body>
<div class="top">
 <div class="head">
  <h1>Bản tin Di trú</h1>
  <div class="meta"><span class="dot"></span><span id="upd">Đang tải…</span><span id="cnt"></span></div>
 </div>
 <div class="bar" id="bar">
  <span id="groups"></span>
  <span class="sep"></span>
  <button data-p="policy">Chỉ tin chính sách</button>
  <button data-t="official">Chỉ nguồn chính phủ</button>
  <label for="sort" class="sr">Xếp theo</label>
  <select id="sort"><option value="prio">Xếp: Ưu tiên</option><option value="new">Xếp: Mới nhất</option></select>
  <label for="q" class="sr">Tìm kiếm</label>
  <input id="q" type="search" placeholder="Tìm: 482, EB-5, golden visa, Express Entry…">
 </div>
</div>
<details id="sum" class="sum" hidden></details>
<main class="board" id="board"></main>
<button id="toast" hidden></button>
<script>
// Thứ tự cột theo yêu cầu: Mỹ, Úc, Canada, Châu Âu, Dubai
const COLS = [["US","🇺🇸","Mỹ"],["AU","🇦🇺","Úc"],["CA","🇨🇦","Canada"],["EU","🇪🇺","Châu Âu"],["AE","🇦🇪","Dubai"]];
const GROUPS = {chung:"Chung các loại","tay-nghe":"Tay nghề","dau-tu":"Đầu tư",khac:"Khác"};
const PAGE = 25, POLL_MS = 60000;
let data = {items:[], taxonomy:{}}, group = "ALL", policyOnly = false, officialOnly = false, query = "",
    sortMode = safeGet("sortMode") || "prio", knownIds = null, shown = {};
const lastVisit = +(safeGet("lastVisit") || 0);

function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getTime()}
function when(d){return new Date(d).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function visaName(c,v){return (((data.taxonomy[c]||{}).visas||{})[v]||v).split(" · ")[0]}

function filtered(){
  const q=query.toLowerCase();
  return data.items.filter(i=>(group==="ALL"||(i.groups||[]).includes(group))&&(!policyOnly||i.policy)
    &&(!officialOnly||i.type==="official")&&(!q||(i.title+" "+(i.summary||"")+" "+i.publisher).toLowerCase().includes(q)));
}
function card(i){
  const isNew=lastVisit&&new Date(i.fetched)>lastVisit;
  const dir=i.direction==="siet"?'<span class="dir siet" title="Chính sách bị siết chặt">▼ Siết</span>'
          :i.direction==="noi"?'<span class="dir noi" title="Chính sách được nới lỏng">▲ Nới</span>'
          :i.policy&&i.type!=="official"?'<span class="pol">Chính sách</span>':"";
  const g=(i.groups||[])[0], v=(i.visas||[])[0];
  return `<article class="card"><a href="${esc(i.link)}" target="_blank" rel="noopener" title="${esc(i.title)}">${esc(i.title)}</a>
    ${i.summary?`<p>${esc(i.summary)}</p>`:""}
    <div class="tags">${isNew?'<span class="badge">MỚI</span>':""}${dir}
      ${g?`<span class="gtag">${esc(GROUPS[g]||g)}</span>`:""}${v?`<span class="vtag">${esc(visaName(i.country,v))}</span>`:""}
      ${i.type==="official"?'<span class="off">Chính phủ</span>':""}
      <span class="src">${esc(i.publisher)}</span><span>${when(i.published)}</span></div></article>`;
}
function render(){
  const items=filtered();
  if(sortMode==="prio") // trong từng tuần: tiếng Việt, tin chính sách, diện định cư chính lên trước
    items.sort((a,b)=>weekStart(b.published)-weekStart(a.published)||(b.score||0)-(a.score||0)||(a.published<b.published?1:-1));
  const byC={};items.forEach(i=>(byC[i.country]=byC[i.country]||[]).push(i));
  document.getElementById("cnt").textContent=`· ${COLS.reduce((n,[c])=>n+(byC[c]||[]).length,0)} tin`;
  document.getElementById("board").innerHTML=COLS.map(([c,flag,name])=>{
    const list=byC[c]||[], n=shown[c]||PAGE;
    return `<section class="col" style="--c:var(--${c})" aria-label="${name}">
      <h2>${flag} ${name}<span class="n">${list.length} tin</span></h2>
      <div class="list">${list.length?list.slice(0,n).map(card).join(""):'<div class="empty">Không có tin phù hợp.</div>'}
      ${list.length>n?`<button class="more" data-c="${c}">Xem thêm ${Math.min(PAGE,list.length-n)} tin</button>`:""}</div></section>`;
  }).join("");
  document.querySelectorAll(".more").forEach(b=>b.onclick=()=>{shown[b.dataset.c]=(shown[b.dataset.c]||PAGE)+PAGE;render()});
}
function renderGroups(){
  // 4 nhóm theo Google Sheet "SL | KEYWORD", đếm trên 5 thị trường đang hiển thị
  const cols=new Set(COLS.map(c=>c[0])), cnt={};
  data.items.forEach(i=>{if(cols.has(i.country))(i.groups||[]).forEach(g=>cnt[g]=(cnt[g]||0)+1)});
  const box=document.getElementById("groups");
  box.innerHTML=`<button data-g="ALL" class="${group==="ALL"?"on":""}">Tất cả nhóm</button>`+
    Object.entries(GROUPS).map(([id,name])=>`<button data-g="${id}" class="${group===id?"on":""}">${name}<span>${cnt[id]||0}</span></button>`).join(" ");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{group=b.dataset.g;shown={};renderGroups();render()});
}
async function load(){
  try{
    const r=await fetch("data/news.json?t="+Date.now(),{cache:"no-store"}), fresh=await r.json();
    const ids=new Set(fresh.items.map(i=>i.id));
    if(knownIds){
      const n=[...ids].filter(id=>!knownIds.has(id)).length;
      if(n){const t=document.getElementById("toast");t.textContent=`🔔 ${n} tin mới — bấm để xem`;t.hidden=false;
        t.onclick=()=>{t.hidden=true;document.querySelectorAll(".list").forEach(l=>l.scrollTop=0);scrollTo({top:0,behavior:"smooth"})}}
    }
    knownIds=ids;data=fresh;
    document.getElementById("upd").textContent="Cập nhật "+new Date(fresh.updated).toLocaleString("vi-VN");
    renderGroups();render();
  }catch(e){document.getElementById("upd").textContent="Không tải được dữ liệu, đang thử lại…"}
}
async function loadSummary(){
  try{
    const r=await fetch("data/summary.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const s=await r.json(), box=document.getElementById("sum");
    if(Date.now()-new Date(s.generated)>8*864e5)return; // tóm tắt AI đang tắt: bản cũ hơn 8 ngày thì ẩn
    box.innerHTML=`<summary>Tóm tắt tuần · Top ${s.highlights.length} thay đổi (AI)</summary>
      <ol>${s.highlights.map(h=>`<li><b>${esc(h.headline)}</b> — ${esc(h.detail)} <span class="imp">→ ${esc(h.impact)}</span></li>`).join("")}</ol>`;
    box.hidden=false;
  }catch(e){}
}
document.getElementById("bar").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p){policyOnly=!policyOnly;b.classList.toggle("on",policyOnly)}
  else if(b.dataset.t){officialOnly=!officialOnly;b.classList.toggle("on",officialOnly)}
  else return;
  shown={};render();
});
document.getElementById("q").oninput=e=>{query=e.target.value;shown={};render()};
const sortSel=document.getElementById("sort");sortSel.value=sortMode;
sortSel.onchange=e=>{sortMode=e.target.value;safeSet("sortMode",sortMode);render()};
addEventListener("beforeunload",()=>safeSet("lastVisit",Date.now()));
load().then(loadSummary);setInterval(load,POLL_MS);
</script>
</body>
</html>
