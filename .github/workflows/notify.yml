name: Gửi email bản tin
on:
  schedule:
    - cron: "30 1 * * *"   # kiểm tra 8:30 sáng mỗi ngày (giờ VN); notify.py tự gửi khi đủ 3 ngày
  workflow_dispatch:
    inputs:
      force:
        description: "Gửi ngay, không chờ đủ 3 ngày"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python notify.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Lưu thời điểm gửi
        run: |
          git config user.name "ditru-bot"
          git config user.email "ditru-bot@users.noreply.github.com"
          [ -f docs/data/notify_state.json ] || exit 0
          git add docs/data/notify_state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Đã gửi email bản tin $(date -u +%F)"
          # Lưu được thời điểm gửi thì lần sau mới không gửi trùng: thử đẩy 3 lần
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 10))
          done
          exit 1
