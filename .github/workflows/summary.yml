name: Tóm tắt tuần (AI) — ĐANG TẮT
# Đã tắt để không phát sinh chi phí API: bỏ lịch chạy và không truyền ANTHROPIC_API_KEY,
# nên kể cả bấm Run workflow thì summarize.py cũng tự bỏ qua.
# Bật lại: thêm `schedule: - cron: "0 1 * * 1"` vào `on:` và thêm
#   env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} } cho bước summarize.py
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Tóm tắt tuần bằng AI đang tắt (không dùng chi phí API)."
