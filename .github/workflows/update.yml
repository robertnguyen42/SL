name: Cập nhật tin di trú
on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_news.py
      - name: Commit nếu có tin mới
        run: |
          git config user.name "ditru-bot"
          git config user.email "ditru-bot@users.noreply.github.com"
          git add docs/data/news.json
          git diff --cached --quiet || (git commit -m "Cập nhật tin $(date -u +%F' '%H:%M)" && git push)
