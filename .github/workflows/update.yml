name: Cập nhật tin di trú
on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_news.py
      - run: pip install -q anthropic pydantic
        continue-on-error: true
      # Claude phân loại siết/nới theo lô (vài giờ một lần); chưa có API key thì tự bỏ qua
      - run: python classify.py
        continue-on-error: true   # lỗi AI không được chặn việc cập nhật tin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Commit nếu có tin mới
        run: |
          git config user.name "ditru-bot"
          git config user.email "ditru-bot@users.noreply.github.com"
          git add docs/data/news.json $(ls docs/data/ai_labels.json 2>/dev/null)
          git diff --cached --quiet || (git commit -m "Cập nhật tin $(date -u +%F' '%H:%M)" && git pull --rebase -q && git push)
