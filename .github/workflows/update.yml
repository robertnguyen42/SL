name: Cập nhật tin di trú
on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
concurrency: { group: update-news, cancel-in-progress: false }   # không chạy chồng 2 lần cập nhật
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python sync_keywords.py   # lấy keyword mới nhất từ Google Sheet (lỗi thì giữ bản cũ)
      - run: python fetch_news.py
      # AI phân loại Siết/Nới (classify.py) đang TẮT để không phát sinh chi phí API.
      # Bật lại: thêm 2 bước "pip install -q anthropic pydantic" và "python classify.py" (env ANTHROPIC_API_KEY) vào đây.
      - name: Commit nếu có tin mới
        run: |
          git config user.name "ditru-bot"
          git config user.email "ditru-bot@users.noreply.github.com"
          git add docs/data/news.json sheet_keywords.csv $(ls docs/data/ai_labels.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -q -m "Cập nhật tin $(date -u +%F' '%H:%M)"
          # Thử đẩy 3 lần; nếu trùng file với lần chạy khác thì giữ bản mới vừa lấy (-X theirs)
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 10))
          done
          exit 1
